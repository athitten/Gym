# Pi in per-task GDPVal sandboxes, judged in-session (rubric by default). For multi-stage or judge-only ELO, copy the
# exports into a cache with resources_servers/gdpval/cache_sandbox_deliverables.py and score that cache judge-only
# (see "Fresh vs. cached deliverables" in benchmarks/gdpval/README.md).
config_paths:
- resources_servers/gdpval/configs/gdpval.yaml
- responses_api_agents/pi_agent/configs/pi_agent.yaml
- environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml
gdpval_resources_server:
  resources_servers:
    gdpval:
      entrypoint: app.py
      sandbox_provider: sandbox
      num_workers: 1
      allowed_agents:
      - pi_agent
      image: ???
      deliverables_root: ???
      # Without LibreOffice on the host, convert Office files with the GDP image instead. The command must see TMPDIR
      # and the deliverable and reference directories at the same paths.
      # libreoffice_command: [apptainer, exec, --bind, /lustre, --bind, /tmp, /path/to/gdpval.sif, libreoffice]
      verified: false
single_agent_turn_legacy:
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        name: gdpval_resources_server
      agent_server:
        name: pi_agent
      max_concurrent_episodes: 1
      queue_timeout_seconds: 60
# Requires an existing, audited GDP SIF and Apptainer installation.
sandbox:
  apptainer:
    create:
      mount_point: /workspace
      extra_start_args:
      - --containall
      - --writable-tmpfs
    exec:
      extra_exec_args:
      - --writable-tmpfs
gdpval_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ???
      openai_api_key: ???
      openai_model: ???
